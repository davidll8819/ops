services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: office_admin
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run scripts/setup-local.mjs first}
      POSTGRES_DB: office
    ports: ['127.0.0.1:55432:5432']
    volumes: [office_pg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U office_admin -d office']
      interval: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    ports: ['127.0.0.1:56379:6379']
    volumes: [office_redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 12
volumes:
  office_pg:
  office_redis:
